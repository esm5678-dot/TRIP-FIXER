name: Check rehearsal
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - run: npm sbom --sbom-format cyclonedx --package-lock-only > sbom-ci.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-ci.cdx.json
