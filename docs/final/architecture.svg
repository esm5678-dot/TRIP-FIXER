<text x="46" y="1094" text-anchor="start" font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="400" font-size="15" fill="#627266">요청 통로(API)는 휴대폰 화면과 서버가 입력·결과를 주고받는 연결점이다.</text>
